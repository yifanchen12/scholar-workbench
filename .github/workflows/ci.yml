name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Core, state and numerical checks
        run: |
          node tests/core.test.js
          node tests/cards.test.cjs
          node tests/state-integrity.test.cjs
          node tests/backup-size.test.cjs
          node tests/digits.test.cjs
          node tests/metrics.test.cjs
          node tests/record-ocr.test.cjs
          python practice/test_math_lab.py
          python scripts/audit-public.py
      - name: HTTP and mocked provider protocol
        run: |
          node server.js > /tmp/scholar-workbench-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e 'const wait=async()=>{for(let i=0;i<50;i++){try{if((await fetch("http://127.0.0.1:5179")).ok)return;}catch{}await new Promise(r=>setTimeout(r,100));}process.exit(1);};wait();'
          node tests/server.test.cjs
          node tests/textbook-api.test.cjs
          node tests/textbook-wait.test.cjs
          node tests/evidence-picker.test.cjs
          node tests/desktop-transfer.test.cjs
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned desktop runtime and test driver
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.62.1
      - name: Real native file drop and browser data migration
        run: |
          node tests/desktop-launcher.test.cjs
          node tests/evidence-export.test.cjs
          node tests/desktop.test.cjs
          node tests/desktop-photos.test.cjs
      - name: Browser photo preview, copy and transfer
        env:
          BROWSER_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: node tests/photo-browser.test.cjs
  teaching-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU practice dependency
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Training invariants and CPU resume
        run: python tests/tiny_llm.test.py
